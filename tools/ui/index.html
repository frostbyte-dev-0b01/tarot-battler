<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Battler Dev Tools</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="workspace-topline">
        <nav class="tab-bar" aria-label="Workspace sections">
          <button class="tab-button is-active" type="button" data-tab-target="team-builder">
            Team Builder
          </button>
          <button class="tab-button" type="button" data-tab-target="replay-viewer">
            Replay Viewer
          </button>
        </nav>

        <div class="replay-inline-actions" id="replay-inline-actions" aria-label="Replay loading actions">
          <input id="replay-file-input" class="visually-hidden" type="file" accept=".json,application/json">
          <button id="replay-file-button" type="button" class="icon-button replay-open-button button-quiet" title="Open replay JSON" aria-label="Open replay JSON">📂</button>
          <button id="replay-demo-button" type="button" class="button-secondary">Load Latest Replay</button>
        </div>
      </div>

      <main>
        <section class="workspace is-active" id="team-builder" aria-label="Team Builder">
          <div class="team-builder-layout">
            <section class="panel panel-team" aria-label="Team Builder Editor">
              <div class="panel-body team-loader-body">
                <input id="team-file-input" class="visually-hidden" type="file" accept=".json,application/json">
                <div id="team-editor" class="team-editor-shell">
                  <div class="board-empty-state">Load a team to edit it here.</div>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="workspace" id="replay-viewer" aria-labelledby="replay-viewer-heading">
          <h2 id="replay-viewer-heading" class="visually-hidden">Replay Viewer</h2>
          <textarea
            id="replay-json-input"
            class="visually-hidden"
            rows="10"
            spellcheck="false"
            placeholder="Replay JSON buffer"
          ></textarea>

          <div class="replay-stage">
            <aside class="replay-sidebar">
              <section class="replay-side-panel replay-inspector-shell is-open" data-replay-panel="detail" aria-labelledby="inspector-heading">
                <div class="replay-side-header">
                  <button class="replay-side-toggle" type="button" data-replay-panel-toggle="detail" aria-expanded="true">
                    <h3 id="inspector-heading">Character Detail</h3>
                  </button>
                </div>
                <div id="inspector-panel" class="replay-side-body inspector-panel">
                  <div class="board-empty-state">
                    click any character to inspect
                  </div>
                </div>
              </section>

              <section class="replay-side-panel replay-log-shell is-collapsed" data-replay-panel="log" aria-labelledby="timeline-heading">
                <div class="replay-side-header">
                  <button class="replay-side-toggle" type="button" data-replay-panel-toggle="log" aria-expanded="false">
                    <h3 id="timeline-heading">Battle Log</h3>
                  </button>
                </div>
                <div class="replay-side-body timeline-panel-body">
                  <div id="timeline-list" class="timeline-list">
                    <div class="board-empty-state">
                      Load a replay to view the timeline.
                    </div>
                  </div>
                </div>
              </section>
            </aside>

            <section class="replay-main">
              <div class="replay-board-head">
                <div class="replay-turn-chip">
                  <span id="current-event-tick">Turn 1</span>
                  <span id="current-event-index">Step 0</span>
                </div>
                <p id="current-event-text" class="replay-current-text">
                  Load a replay and move through events to see the current step here.
                </p>
              </div>

              <section class="replay-arena" aria-labelledby="board-heading">
                <h3 id="board-heading" class="visually-hidden">Battle Grid</h3>
                <div class="arena-team-label arena-team-label-a">your team</div>
                <div class="arena-team-label arena-team-label-b">opponent</div>
                <div class="arena-depth-label arena-depth-left">back</div>
                <div class="arena-depth-label arena-depth-center-left">front</div>
                <div class="arena-depth-label arena-depth-center-right">front</div>
                <div class="arena-depth-label arena-depth-right">back</div>
                <div id="battle-board" class="battle-board"></div>
              </section>

              <section class="replay-controls-bar" aria-labelledby="playback-heading">
                <h3 id="playback-heading" class="visually-hidden">Playback Controls</h3>
                <button id="replay-previous-button" type="button" disabled>&larr; prev</button>
                <button id="replay-play-button" type="button" disabled>&#9654; play</button>
                <button id="replay-next-button" type="button" disabled>next &rarr;</button>
                <div class="speed-group" role="group" aria-label="Playback speed">
                  <button class="speed-button" type="button" data-speed="0.5">0.5x</button>
                  <button class="speed-button is-active" type="button" data-speed="1">1x</button>
                  <button class="speed-button" type="button" data-speed="2">2x</button>
                  <button class="speed-button" type="button" data-speed="4">4x</button>
                </div>
                <div class="replay-step-counter" id="replay-event-label">1 / 1</div>
                <input id="replay-event-slider" class="visually-hidden" type="range" min="0" max="0" value="0" disabled>
                <button id="replay-pause-button" class="visually-hidden" type="button" disabled>Pause</button>
                <button id="replay-restart-button" class="visually-hidden" type="button" disabled>Restart</button>
                <div class="visually-hidden">
                  <span>Tick</span>
                  <strong id="replay-tick-display">0</strong>
                </div>
                <input id="timeline-major-only" class="visually-hidden" type="checkbox">
                <input id="timeline-selected-only" class="visually-hidden" type="checkbox">
              </section>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>

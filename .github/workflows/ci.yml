name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Battle engine (fmt + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battle_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: battle_engine
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo test
        run: cargo test

  server:
    name: Server (fmt + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test

  ui-unit:
    name: UI unit tests (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --test tools/ui/tests/*.test.cjs

  ui-smoke:
    name: UI smoke test (Tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run smoke test
        run: |
          python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 2
          SMOKE_SERVE=0 SMOKE_PORT=8099 node tools/ui/smoke-test.cjs
